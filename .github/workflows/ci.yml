name: C++ CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache apt packages (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-boost-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-boost-${{ runner.os }}-

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang-tidy-17 clang-format-17 \
            libboost-graph-dev libboost-log-dev libboost-json-dev libboost-program-options-dev

      - name: Add MinGW-w64 to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "C:\msys64\mingw64\bin"

      - name: Check CMake (Windows)
        if: runner.os == 'Windows'
        id: check_cmake
        run: cmake --version
        continue-on-error: true

      - name: Install CMake (Windows, if not pre-installed)
        if: runner.os == 'Windows' && steps.check_cmake.outcome == 'failure'
        uses: lukka/get-cmake@latest

      - name: Enable vcpkg binary caching (Windows)
        if: runner.os == 'Windows'
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install Boost via vcpkg (Windows)
        if: runner.os == 'Windows'
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: |
          vcpkg install `
            boost-graph:x64-mingw-dynamic `
            boost-log:x64-mingw-dynamic `
            boost-json:x64-mingw-dynamic `
            boost-program-options:x64-mingw-dynamic
        shell: pwsh

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build `
            -G "MinGW Makefiles" `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_COMPILER=g++ `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-mingw-dynamic
        shell: pwsh

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure -C Release --parallel

      - name: Check formatting (Linux)
        if: runner.os == 'Linux'
        run: |
          find . \( -name '*.cpp' -o -name '*.h' \) -not -path './build/*' | xargs clang-format-17 --dry-run --Werror

      - name: Run clang-tidy (Linux)
        if: runner.os == 'Linux'
        run: |
          find src -name '*.cpp' | xargs clang-tidy-17 -p build/ --quiet

  build-and-test-msvc:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: microsoft/setup-msbuild@v2

      - name: Enable vcpkg binary caching (MSVC)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install Boost via vcpkg (MSVC x64)
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: |
          vcpkg install boost-graph:x64-windows boost-log:x64-windows boost-json:x64-windows boost-program-options:x64-windows
          echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Configure (MSVC)
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_TOOLCHAIN_FILE=${{ env.CMAKE_TOOLCHAIN_FILE }}
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build (MSVC)
        run: cmake --build build --config Release

      - name: Run tests (MSVC)
        run: |
          cd build
          ctest --output-on-failure -C Release --parallel
